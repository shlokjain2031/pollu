<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbai Air Quality Heatmap</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>
    
    <!-- Pollu Info Box -->
    <div class="pollu-info-box">
        <h2 class="pollu-heading">Pollu</h2>
        <p class="pollu-description">High res (30m x 30m) PM<sub>2.5</sub> values at an error of 8µg/m³</p>
        <div class="github-links">
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a><a href="#" target="_blank" rel="noopener noreferrer">How</a>
        </div>
    </div>
    
    <!-- Search Box -->
    <div class="search-container">
        <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Search location in Mumbai..."
            autocomplete="off"
        />
        <ul id="search-results" class="search-results"></ul>
    </div>
    
    <!-- PM2.5 Info Box -->
    <div id="pm25-info" class="pm25-info" style="display: none;">
        <h3 class="pm25-heading" id="pm25-value">PM<sub>2.5</sub> is 120 µg/m³ here</h3>
        <p class="pm25-caption" id="pm25-category">Dangerous</p>
        
        <!-- Color Scale -->
        <div class="pm25-scale">
            <div class="scale-bar">
                <div class="scale-band" style="background-color: #2ecc71; width: 7%;" title="Good: 0-35"></div>
                <div class="scale-band" style="background-color: #a9d82f; width: 8%;" title="Satisfactory: 36-75"></div>
                <div class="scale-band" style="background-color: #ffd700; width: 8%;" title="Moderately Polluted: 76-115"></div>
                <div class="scale-band" style="background-color: #ff8c00; width: 7%;" title="Poor: 116-150"></div>
                <div class="scale-band" style="background-color: #e74c3c; width: 20%;" title="Very Poor: 151-250"></div>
                <div class="scale-band" style="background-color: #8b0000; width: 50%;" title="Severe: 250+"></div>
                <div class="scale-indicator" id="scale-indicator"></div>
            </div>
            <div class="scale-labels">
                <span>0</span>
                <span>50</span>
                <span>100</span>
                <span>200</span>
                <span>300</span>
                <span>500</span>
            </div>
        </div>
        
        <p class="pm25-updated" id="pm25-updated">Updated 0 minutes ago</p>
        <p class="pm25-footer" id="pm25-footer">Data from satellite and ground sensors</p>
        <p class="pm25-tagline" id="pm25-tagline">Placeholder for a witty one-liner about air quality</p>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JS -->
    <script src="js/map.js"></script>
</body>
</html>
