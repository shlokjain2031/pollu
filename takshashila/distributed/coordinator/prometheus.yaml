# Prometheus Configuration for Takshashila Coordinator
# Item 33: Scrape configuration specification

# Global settings
global:
  scrape_interval: 15s       # Default scrape interval
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: "takshashila"
    service: "coordinator"

# Rule files
rule_files:
  - "slo_recording_rules.yaml"
  - "coordinator_alerts.yaml"

# Scrape configurations
scrape_configs:
  - job_name: "takshashila-coordinator"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["coordinator:8080"]
        labels:
          environment: "production"
