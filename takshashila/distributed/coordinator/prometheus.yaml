# Prometheus configuration for Takshashila Coordinator

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "takshashila"
    service: "coordinator"

scrape_configs:
  - job_name: "coordinator"
    static_configs:
      - targets: ["localhost:8080"]
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: "/metrics"

rule_files:
  - "coordinator_alerts.yaml"
